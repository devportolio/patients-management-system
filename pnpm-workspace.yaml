packages:
  - "apps/*"
  - "packages/*"

# Allow postinstall build scripts for these trusted packages
# (pnpm v10+ blocks dependency build scripts by default).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
